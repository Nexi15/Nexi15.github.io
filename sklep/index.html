<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACK // SKLEP</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #111420;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --success: #00ff66;
      --success-glow: rgba(0, 255, 102, 0.3);
      --key-bg: #1a1e2e;
      --text: #ffffff;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Karta hacka */
    .hack-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      width: 420px;
      padding: 28px 24px 20px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: -10px;
    }

    /* Wprowadzony kod na górze */
    .code-display {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .code-slot {
      width: 48px;
      height: 54px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dim);
      transition: all 0.3s ease;
      position: relative;
    }

    .code-slot.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .code-slot.done {
      border-color: var(--success);
      color: var(--success);
      box-shadow: 0 0 12px var(--success-glow);
    }

    .code-slot.dot::after {
      content: '•';
    }

    /* Klawiatura cyfrowa */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 12px;
    }

    .key-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .key {
      width: 100%;
      height: 60px;
      background: var(--key-bg);
      border: 2px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .key.target {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      background: rgba(255, 0, 85, 0.05);
    }

    /* Pasek timera / strefy pod przyciskiem (widoczny zawsze dla aktywnego) */
    .timing-bar-container {
      width: 60%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      visibility: hidden;
    }

    .timing-bar-container.visible {
      visibility: visible;
    }

    .timing-zone {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      z-index: 1;
    }

    .timing-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--accent);
      z-index: 2;
    }

    /* Statystyki pod spodem */
    .stats {
      display: flex;
      justify-content: space-around;
      text-align: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
    }

    .instruction {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Pasek globalnego czasu (30 Sekund) */
    .global-timer {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 5px;
    }

    .global-timer-bar {
      width: 100%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="hack-card">
    <div class="header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v-2h3v2zm4 0h-2v-2h2v2z"/></svg>
      <span>Klawiatura</span>
    </div>
    <div class="subtitle">Przytrzymaj cyfry i puść w zielonej strefie.</div>

    <!-- Puste sloty na kod -->
    <div class="code-display" id="codeDisplay"></div>

    <!-- Klawiatura 1-9 -->
    <div class="keypad" id="keypad"></div>

    <!-- Statystyki -->
    <div class="stats">
      <div class="stat-box">
        <span class="stat-label">Runda</span>
        <span class="stat-val" id="roundVal">1/4</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Postęp</span>
        <span class="stat-val" id="progressVal">0/4</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Próby</span>
        <span class="stat-val" id="attemptsVal">0/3</span>
      </div>
    </div>

    <div class="instruction">
      Przytrzymaj podświetloną cyfrę<br>Puść w zielonej strefie
    </div>

    <div class="global-timer">
      <div class="global-timer-bar" id="globalBar"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      totalRounds: 4,
      codeLength: 4,
      maxFailures: 3,
      totalTime: 30000 // 30 sekund na cały hack
    };

    let state = {
      round: 1,
      failures: 0,
      code: [],
      currentIndex: 0,
      holding: false,
      holdProgress: 0,
      holdInterval: null,
      targetZone: { min: 45, max: 65 }, // Zaznaczona zielona strefa %
      timeLeft: CONFIG.totalTime,
      timerInterval: null
    };

    const codeDisplay = document.getElementById('codeDisplay');
    const keypad = document.getElementById('keypad');
    const roundVal = document.getElementById('roundVal');
    const progressVal = document.getElementById('progressVal');
    const attemptsVal = document.getElementById('attemptsVal');
    const globalBar = document.getElementById('globalBar');

    function initGame() {
      state.round = 1;
      state.failures = 0;
      state.timeLeft = CONFIG.totalTime;
      startRound();
      startGlobalTimer();
    }

    function startRound() {
      state.code = Array.from({ length: CONFIG.codeLength }, () => Math.floor(Math.random() * 9) + 1);
      state.currentIndex = 0;
      
      // Wygeneruj nową zieloną strefę
      generateNewZone();
      updateUI();
      renderKeypad();
    }

    function generateNewZone() {
      const min = Math.floor(Math.random() * 30) + 35; // strefa między 35% a 65%
      state.targetZone = { min: min, max: min + 20 };  // szerokość strefy 20%
    }

    function renderKeypad() {
      keypad.innerHTML = '';
      codeDisplay.innerHTML = '';

      // Wyświetlanie kodów na górze
      state.code.forEach((num, idx) => {
        const slot = document.createElement('div');
        slot.className = 'code-slot';
        if (idx < state.currentIndex) {
          slot.classList.add('done');
          slot.textContent = num;
        } else if (idx === state.currentIndex) {
          slot.classList.add('active');
          slot.classList.add('dot');
        } else {
          slot.classList.add('dot');
        }
        codeDisplay.appendChild(slot);
      });

      // Wyświetlanie przycisków 1-9
      for (let i = 1; i <= 9; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'key-wrapper';

        const btn = document.createElement('div');
        btn.className = 'key';
        btn.textContent = i;
        btn.id = `key-${i}`;

        const isTargetKey = (i === state.code[state.currentIndex]);

        if (isTargetKey) {
          btn.classList.add('target');
        }

        // Pasek przytrzymania pod klawiszem
        const timingBar = document.createElement('div');
        timingBar.className = 'timing-bar-container';
        if (isTargetKey) {
          timingBar.classList.add('visible'); // Widać pasek od razu pod aktywną cyfrą
        }

        // Zielona strefa wewnątrz
        const zone = document.createElement('div');
        zone.className = 'timing-zone';
        zone.style.left = `${state.targetZone.min}%`;
        zone.style.width = `${state.targetZone.max - state.targetZone.min}%`;

        const progress = document.createElement('div');
        progress.className = 'timing-progress';
        progress.id = `progress-${i}`;

        timingBar.appendChild(zone);
        timingBar.appendChild(progress);

        wrapper.appendChild(btn);
        wrapper.appendChild(timingBar);
        keypad.appendChild(wrapper);

        // Eventy myszy / dotyku
        btn.addEventListener('mousedown', () => startHold(i));
        btn.addEventListener('mouseup', () => stopHold(i));
        btn.addEventListener('mouseleave', () => { if (state.holding) stopHold(i); });

        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(i); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); stopHold(i); });
      }
    }

    function startHold(num) {
      if (num !== state.code[state.currentIndex] || state.holding) return;

      state.holding = true;
      state.holdProgress = 0;
      
      const progress = document.getElementById(`progress-${num}`);

      state.holdInterval = setInterval(() => {
        state.holdProgress += 2; // Prędkość napełniania
        if (progress) progress.style.width = `${state.holdProgress}%`;

        // Przekroczenie 100% = błąd
        if (state.holdProgress >= 100) {
          stopHold(num);
        }
      }, 15);
    }

    function stopHold(num) {
      if (!state.holding || num !== state.code[state.currentIndex]) return;

      clearInterval(state.holdInterval);
      state.holding = false;

      // Sprawdzenie czy trafiliśmy w zieloną strefę
      if (state.holdProgress >= state.targetZone.min && state.holdProgress <= state.targetZone.max) {
        // Trafione!
        state.currentIndex++;
        if (state.currentIndex >= CONFIG.codeLength) {
          // Sukces rundy
          if (state.round >= CONFIG.totalRounds) {
            clearInterval(state.timerInterval);
            alert("HACK UDANY! Włam zakończony sukcesem.");
            initGame();
          } else {
            state.round++;
            startRound();
          }
        } else {
          generateNewZone();
          renderKeypad();
          updateUI();
        }
      } else {
        // Błąd - nie trafiono w zieloną strefę
        failAttempt();
      }
    }

    function failAttempt() {
      state.failures++;
      updateUI();

      if (state.failures >= CONFIG.maxFailures) {
        clearInterval(state.timerInterval);
        alert("HACK NIEUDANY! Przekroczono limit błędów.");
        initGame();
      } else {
        // Zrestartuj cyfry w bieżącej rundzie
        startRound();
      }
    }

    function startGlobalTimer() {
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.timeLeft -= 100;
        const pct = (state.timeLeft / CONFIG.totalTime) * 100;
        globalBar.style.width = `${Math.max(0, pct)}%`;

        if (state.timeLeft <= 0) {
          clearInterval(state.timerInterval);
          alert("HACK NIEUDANY! Czas minął.");
          initGame();
        }
      }, 100);
    }

    function updateUI() {
      roundVal.textContent = `${state.round}/${CONFIG.totalRounds}`;
      progressVal.textContent = `${state.currentIndex}/${CONFIG.codeLength}`;
      attemptsVal.textContent = `${state.failures}/${CONFIG.maxFailures}`;
    }

    // Obsługa fizycznej klawiatury (1-9)
    window.addEventListener('keydown', (e) => {
      const keyNum = parseInt(e.key);
      if (keyNum >= 1 && keyNum <= 9) {
        startHold(keyNum);
      }
    });

    window.addEventListener('keyup', (e) => {
      const keyNum = parseInt(e.key);
      if (keyNum >= 1 && keyNum <= 9) {
        stopHold(keyNum);
      }
    });

    initGame();
  </script>
</body>
</html>
