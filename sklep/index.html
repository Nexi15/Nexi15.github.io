<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiveM Store Hack - Mini Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090c10;
      --panel-bg: rgba(13, 19, 29, 0.92);
      --border-cyan: #00f0ff;
      --glow-cyan: rgba(0, 240, 255, 0.4);
      --green-hack: #00ff66;
      --green-glow: rgba(0, 255, 102, 0.4);
      --red-fail: #ff2a55;
      --text-main: #e1e7ed;
      --text-dim: #5a6e85;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    /* RAMKA SYSTEMU (FIVEM UI) */
    .hack-frame {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 30px var(--glow-cyan), inset 0 0 15px rgba(0, 240, 255, 0.05);
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 20px;
      font-family: 'Share Tech Mono', monospace;
    }

    .system-title {
      font-size: 1.1rem;
      color: var(--border-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .stage-text {
      font-size: 0.85rem;
      color: var(--green-hack);
      background: rgba(0, 255, 102, 0.1);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
    }

    /* PASEK CZASU */
    .timer-container {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--border-cyan);
      box-shadow: 0 0 10px var(--border-cyan);
      transition: width 0.1s linear;
    }

    /* POZIOM 1: PRZESUWANKA 4x4 (1-15) */
    .grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .tile {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-cyan);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--border-cyan);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .tile:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 10px var(--glow-cyan);
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.empty {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      cursor: default;
    }

    /* POZIOM 2: SEKWENCJA CYFR */
    .pad-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pad-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .display-screen {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2.2rem;
      letter-spacing: 8px;
      color: var(--green-hack);
      text-shadow: 0 0 12px var(--green-glow);
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 255, 102, 0.3);
      width: 100%;
      height: 60px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
