<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACK // SYSTEM SKLEPOWY</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090c10;
      --card-bg: rgba(13, 19, 29, 0.94);
      --border-cyan: #00f0ff;
      --glow-cyan: rgba(0, 240, 255, 0.35);
      --accent-pink: #ff0055;
      --glow-pink: rgba(255, 0, 85, 0.4);
      --success-green: #00ff66;
      --glow-green: rgba(0, 255, 102, 0.4);
      --key-bg: #141a26;
      --text-main: #f0f4f8;
      --text-dim: #60738a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* GŁÓWNA KARTA SYSTEMU */
    .hack-card {
      background: var(--card-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 14px;
      width: 100%;
      max-width: 450px;
      padding: 24px;
      box-shadow: 0 0 35px var(--glow-cyan), inset 0 0 15px rgba(0, 240, 255, 0.05);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 12px;
      margin-bottom: 18px;
      font-family: 'Share Tech Mono', monospace;
    }

    .system-title {
      font-size: 1.15rem;
      color: var(--border-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .stage-badge {
      font-size: 0.8rem;
      color: var(--success-green);
      background: rgba(0, 255, 102, 0.1);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      letter-spacing: 1px;
    }

    /* GLOBALNY PASEK CZASU */
    .global-timer {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .global-timer-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--border-cyan), var(--success-green));
      box-shadow: 0 0 10px var(--border-cyan);
      transition: width 0.1s linear;
    }

    /* ================= POZIOM 1: PUZZLE 4x4 ================= */
    .puzzle-instructions {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 15px;
      font-family: 'Share Tech Mono', monospace;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .tile {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-cyan);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--border-cyan);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tile:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 12px var(--glow-cyan);
    }

    .tile.empty {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      cursor: default;
    }

    /* ================= POZIOM 2: TIMING KEYPAD ================= */
    .code-display {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .code-slot {
      width: 46px;
      height: 52px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-dim);
      transition: all 0.25s ease;
    }

    .code-slot.active {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      box-shadow: 0 0 12px var(--glow-pink);
    }

    .code-slot.done {
      border-color: var(--success-green);
      color: var(--success-green);
      box-shadow: 0 0 12px var(--glow-green);
    }

    .code-slot.dot::after {
      content: '•';
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .key-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .key {
      width: 100%;
      height: 54px;
      background: var(--key-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .key.target {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      box-shadow: 0 0 15px var(--glow-pink);
      background: rgba(255, 0, 85, 0.08);
    }

    .timing-bar-container {
      width: 75%;
      height: 6px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      visibility: hidden;
    }

    .timing-bar-container.visible {
      visibility: visible;
    }

    .timing-zone {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--success-green);
      box-shadow: 0 0 8px var(--success-green);
      z-index: 1;
    }

    .timing-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: var(--accent-pink);
      z-index: 2;
    }

    /* STATYSTYKI HACKA */
    .stats {
      display: flex;
      justify-content: space-around;
      text-align: center;
      padding-top: 14px;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      text-transform: uppercase;
    }

    .stat-val {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--border-cyan);
    }

    /* KONTROLA & NAKŁADKA REZULTATU */
    .action-bar {
      margin-top: 16px;
      display: flex;
      justify-content: center;
    }

    .btn-reset {
      font-family: 'Share Tech Mono', monospace;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--border-cyan);
      color: var(--border-cyan);
      padding: 10px 24px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: var(--border-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--glow-cyan);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 12, 16, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      border
