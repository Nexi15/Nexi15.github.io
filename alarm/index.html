<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm - Rozbrajanie Kodów</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0d0e;
      background-image: radial-gradient(#1f2428 1px, transparent 1px);
      background-size: 16px 16px;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #d4cf00;
      text-shadow: 0 0 15px rgba(212, 207, 0, 0.4);
    }

    /* Licznik czasu */
    .timer-container {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff3333;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    /* Siatka z próbami (Wordle-style) */
    .attempts-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .tile {
      width: 55px;
      height: 55px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* Kolory statusów cyfr */
    .tile.correct {
      background-color: #2e7d32; /* Zielony - dobre miejsce */
      border-color: #4caf50;
      box-shadow: 0 0 10px #4caf50;
    }

    .tile.present {
      background-color: #f57f17; /* Żółty - złe miejsce */
      border-color: #fbc02d;
      box-shadow: 0 0 10px #fbc02d;
    }

    .tile.absent {
      background-color: #c62828; /* Czerwony - brak cyfry */
      border-color: #ef5350;
      box-shadow: 0 0 10px #ef5350;
    }

    /* Pole wprowadzania kodu */
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 150px;
      padding: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 5px;
      background: #1f2428;
      border: 2px solid #d4cf00;
      border-radius: 4px;
      color: #fff;
      outline: none;
      box-shadow: 0 0 10px rgba(212, 207, 0, 0.2);
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #d4cf00;
      color: #fff;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #d4cf00;
      color: #0b0d0e;
      box-shadow: 0 0 15px #d4cf00;
    }

    /* Wyświetlanie wyniku / komunikatu */
    .message {
      font-size: 1.2rem;
      font-weight: 700;
      height: 30px;
      margin-bottom: 15px;
      text-align: center;
    }

    .back-btn {
      border-color: rgba(255, 255, 255, 0.2);
      margin-top: 10px;
    }

    .back-btn:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 10px #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ALARM</h1>
    <p>Złam 4-cyfrowy kod (cyfry 1-9, bez powtórzeń)!</p>
  </div>

  <div class="timer-container">
    Czas: <span id="timer">25</span>s
  </div>

  <div class="attempts-grid" id="grid"></div>

  <div class="input-section">
    <input type="text" id="code-input" maxlength="4" placeholder="1234" autofocus autocomplete="off">
    <button class="btn" onclick="submitGuess()">SPRAWDŹ</button>
  </div>

  <div class="message" id="message"></div>

  <div>
    <button class="btn" onclick="initGame()">RESET</button>
    <a href="../index.html" class="btn back-btn">⬅ Powrót do menu</a>
  </div>

  <script>
    let secretCode = [];
    let currentAttempt = 0;
    const maxAttempts = 6;
    let timeLeft = 25;
    let timerInterval = null;
    let gameOver = false;
    let audioCtx = null;
    let alarmInterval = null;

    // Inicjalizacja dźwięku alarmu za pomocą Web Audio API
    function playAlarmSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      function beep() {
        if (!gameOver) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }

      beep();
      alarmInterval = setInterval(beep, 500);
    }

    function stopAlarmSound() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // Losowanie 4 unikalnych cyfr od 1 do 9
    function generateSecretCode() {
      const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
      digits.sort(() => Math.random() - 0.5);
      return digits.slice(0, 4);
    }

    // Inicjalizacja gry
    function initGame() {
      stopAlarmSound();
      gameOver = false;
      currentAttempt = 0;
      timeLeft = 25;
      secretCode = generateSecretCode();
      
      document.getElementById('timer').innerText = timeLeft;
      document.getElementById('message').innerText = '';
      document.getElementById('message').style.color = '#fff';
      document.getElementById('code-input').disabled = false;
      document.getElementById('code-input').value = '';
      document.getElementById('code-input').focus();

      // Tworzenie pustej siatki
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < maxAttempts; i++) {
        const row = document.createElement('div');
        row.className = 'row';
        for (let j = 0; j < 4; j++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }

      // Odliczanie czasu
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        
        if (timeLeft <= 0) {
          endGame(false, "⏰ CZAS MINĄŁ! ALARM AKTYWOWANY!");
        }
      }, 1000);
    }

    // Sprawdzanie wpisanego kodu
    function submitGuess() {
      if (gameOver) return;

      const input = document.getElementById('code-input');
      const guess = input.value.trim();

      // Walidacja
      if (guess.length !== 4 || isNaN(guess) || guess.includes('0')) {
        alert("Wpisz dokładnie 4 cyfry z zakresu 1-9!");
        return;
      }

      // Sprawdzenie powtórzeń
      const uniqueDigits = new Set(guess.split(''));
      if (uniqueDigits.size !== 4) {
        alert("Cyfry nie mogą się powtarzać!");
        return;
      }

      const rows = document.querySelectorAll('.row');
      const currentRowTiles = rows[currentAttempt].children;
      const guessArray = guess.split('');

      // Nakładanie cyfr i sprawdzanie kolorów
      guessArray.forEach((char, i) => {
        currentRowTiles[i].innerText = char;

        if (char === secretCode[i]) {
          currentRowTiles[i].classList.add('correct'); // Zielony
        } else if (secretCode.includes(char)) {
          currentRowTiles[i].classList.add('present'); // Żółty
        } else {
          currentRowTiles[i].classList.add('absent');  // Czerwony
        }
      });

      // Wygrana
      if (guess === secretCode.join('')) {
        endGame(true, "🎉 ALARM ROZBROJONY! BRAWO!");
        return;
      }

      currentAttempt++;
      input.value = '';

      // Przegrana (brak szans)
      if (currentAttempt >= maxAttempts) {
        endGame(false, `🚨 PRZEGRANA! KOD TO: ${secretCode.join('')}`);
      }
    }

    // Pozwolenie na zatwierdzanie klawiszem Enter
    document.getElementById('code-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        submitGuess();
      }
    });

    // Koniec gry
    function endGame(win, msg) {
      gameOver = true;
      clearInterval(timerInterval);
      document.getElementById('code-input').disabled = true;
      
      const msgDiv = document.getElementById('message');
      msgDiv.innerText = msg;

      if (win) {
        msgDiv.style.color = '#4caf50';
      } else {
        msgDiv.style.color = '#ff3333';
        playAlarmSound(); // Włącz dźwięk alarmu przy przegranej
      }
    }

    // Start gry
    initGame();
  </script>
</body>
</html>
