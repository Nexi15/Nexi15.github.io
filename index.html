<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONBEAT.GG HACKS</title>
  <style>
    /* Reset & Podstawy */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0d0e;
      background-image: radial-gradient(#1f2428 1px, transparent 1px);
      background-size: 20px 20px;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Nagłówek */
    header {
      text-align: center;
      margin-bottom: 50px;
    }

    /* ANIMOWANY GRADIENT RÓŻOWY DLA KOTWICY / NAGŁÓWKA */
    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
      
      /* Gradient przemieszczający się */
      background: linear-gradient(
        -45deg, 
        #ff007f, 
        #ff3366, 
        #e040fb, 
        #ff007f
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Animacja płynnego przejścia koloru */
      animation: gradientPink 4s ease infinite;
      
      /* Neonowy poświata w tle */
      filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.4));
    }

    @keyframes gradientPink {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    header p {
      color: #8a8f98;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    /* Siatka z Kartami */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    /* Pojedyncza Karta */
    .card {
      background: rgba(18, 22, 25, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 320px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Tytuł Karty */
    .card-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: auto;
      margin-bottom: auto;
      text-align: center;
      transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
    }

    /* Stopka Karty */
    .card-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .line {
      height: 2px;
      width: 60%;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .btn-text {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      transition: all 0.3s ease;
    }

    /* Efekt Hover na Kartę */
    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card:hover .line {
      width: 100%;
    }

    .card:hover .card-title {
      transform: scale(1.08);
    }

    .card:hover .btn-text {
      opacity: 1;
      letter-spacing: 3px;
    }

    /* ========================================================= */
    /* --- KOLORY I NEON GLOW DLA POSZCZEGÓLNYCH KART --- */
    /* ========================================================= */

    /* 1. Cyan (Lights Out) */
    .card-cyan .card-title { color: #00bcd4; }
    .card-cyan .line { background: #00bcd4; box-shadow: 0 0 8px #00bcd4; }
    .card-cyan .btn-text { color: #00bcd4; }
    .card-cyan:hover {
      border-color: rgba(0, 188, 212, 0.5);
      box-shadow: 0 10px 30px rgba(0, 188, 212, 0.25), inset 0 0 15px rgba(0, 188, 212, 0.1);
    }
    .card-cyan:hover .card-title { color: #00bcd4; text-shadow: 0 0 15px rgba(0, 188, 212, 0.8); }

    /* 2. Yellow (Alarm) */
    .card-yellow .card-title { color: #d4cf00; }
    .card-yellow .line { background: #d4cf00; box-shadow: 0 0 8px #d4cf00; }
    .card-yellow .btn-text { color: #d4cf00; }
    .card-yellow:hover {
      border-color: rgba(212, 207, 0, 0.5);
      box-shadow: 0 10px 30px rgba(212, 207, 0, 0.25), inset 0 0 15px rgba(212, 207, 0, 0.1);
    }
    .card-yellow:hover .card-title { color: #d4cf00; text-shadow: 0 0 15px rgba(212, 207, 0, 0.8); }

    /* 3. Pink (Ammunation) */
    .card-pink .card-title { color: #ff007f; }
    .card-pink .line { background: #ff007f; box-shadow: 0 0 8px #ff007f; }
    .card-pink .btn-text { color: #ff007f; }
    .card-pink:hover {
      border-color: rgba(255, 0, 127, 0.5);
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.25), inset 0 0 15px rgba(255, 0, 127, 0.1);
    }
    .card-pink:hover .card-title { text-shadow: 0 0 18px rgba(255, 0, 127, 0.9); }

    /* 4. Red (Jacht) */
    .card-red .card-title { color: #ff3366; }
    .card-red .line { background: #ff3366; box-shadow: 0 0 8px #ff3366; }
    .card-red .btn-text { color: #ff3366; }
    .card-red:hover {
      border-color: rgba(255, 51, 102, 0.5);
      box-shadow: 0 10px 30px rgba(255, 51, 102, 0.25), inset 0 0 15px rgba(255, 51, 102, 0.1);
    }
    .card-red:hover .card-title { text-shadow: 0 0 18px rgba(255, 51, 102, 0.9); }

    /* 5. Green (Fleeca) */
    .card-green .card-title { color: #00e640; }
    .card-green .line { background: #00e640; box-shadow: 0 0 8px #00e640; }
    .card-green .btn-text { color: #00e640; }
    .card-green:hover {
      border-color: rgba(0, 230, 64, 0.5);
      box-shadow: 0 10px 30px rgba(0, 230, 64, 0.25), inset 0 0 15px rgba(0, 230, 64, 0.1);
    }
    .card-green:hover .card-title { text-shadow: 0 0 18px rgba(0, 230, 64, 0.9); }

    /* Responsywność */
    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Wybierz Hacka</h1>
    <p>Trening Hacków ONBEAT</p>
  </header>

  <div class="grid-container">

    <!-- Lights Out -->
    <a href="lightsout/index.html" class="card card-cyan">
      <div class="card-title">LIGHTS OUT</div>
      <div class="card-footer">
        <div class="line"></div>
        <span class="btn-text">Zagraj ➔</span>
      </div>
    </a>

    <!-- Alarm -->
    <a href="alarm/index.html" class="card card-yellow">
      <div class="card-title">ALARM</div>
      <div class="card-footer">
        <div class="line"></div>
        <span class="btn-text">Zagraj ➔</span>
      </div>
    </a>

    <!-- Ammunation -->
    <a href="ammunation/index.html" class="card card-pink">
      <div class="card-title">AMMUNATION</div>
      <div class="card-footer">
        <div class="line"></div>
        <span class="btn-text">Zagraj ➔</span>
      </div>
    </a>

    <!-- Jacht -->
    <a href="jacht/index.html" class="card card-red">
      <div class="card-title">JACHT</div>
      <div class="card-footer">
        <div class="line"></div>
        <span class="btn-text">Zagraj ➔</span>
      </div>
    </a>

    <!-- Fleeca -->
    <a href="fleeca/index.html" class="card card-green">
      <div class="card-title">FLEECA</div>
      <div class="card-footer">
        <div class="line"></div>
        <span class="btn-text">Zagraj ➔</span>
      </div>
    </a>

  </div>

</body>
</html>
