<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONBEAT.GG // CYBER HUD</title>
  <style>
    :root {
      --primary: #00f0ff;
      --primary-glow: rgba(0, 240, 255, 0.4);
      --bg-dark: #030508;
      --panel-bg: rgba(12, 16, 24, 0.65);
      --border-glow: rgba(255, 255, 255, 0.08);
      --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamiczne Tło Glow */
    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      transition: all 0.6s ease;
      filter: blur(80px);
      opacity: 0.6;
    }

    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Główny Dashboard */
    .dashboard {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
      align-items: center;
    }

    /* LEWY PANEL: PODGLĄD HACKA (SHOWCASE) */
    .showcase-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      transition: border-color 0.4s ease;
    }

    .showcase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sys-tag {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sys-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .difficulty-badge {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--primary);
      color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .showcase-content {
      margin: 30px 0;
    }

    .showcase-title {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 12px;
      text-shadow: 0 0 20px var(--primary-glow);
      transition: all 0.3s ease;
    }

    .showcase-desc {
      color: #8a94a6;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 90%;
    }

    /* Przycisk Launchera */
    .launch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px;
      background: var(--primary);
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 10px 25px var(--primary-glow);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .launch-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 35px var(--primary-glow);
      background: #fff;
    }

    .launch-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* PRAWY PANEL: LISTA SELEKCJI */
    .selector-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selector-title {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #5c6470;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 5px;
    }

    .option-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .option-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .option-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a94a6;
      transition: all 0.3s ease;
    }

    .option-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .option-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #8a94a6;
      transition: color 0.3s ease;
    }

    /* Stan Aktywny / Hover */
    .option-card:hover, .option-card.active {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(6px);
    }

    .option-card.active .option-icon {
      background: var(--opt-color);
      color: #000;
      box-shadow: 0 0 15px var(--opt-color);
    }

    .option-card.active .option-name {
      color: #fff;
    }

    .active-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--opt-color);
      opacity: 0;
      box-shadow: 0 0 10px var(--opt-color);
      transition: opacity 0.3s ease;
    }

    .option-card.active .active-indicator {
      opacity: 1;
    }

    /* RESPONSYWNOŚĆ */
    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .showcase-panel {
        min-height: auto;
        padding: 30px;
      }
      .showcase-title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>
  <canvas id="bgCanvas"></canvas>

  <div class="dashboard">

    <!-- LEWY PANEL PODGLĄDU -->
    <div class="showcase-panel" id="showcasePanel">
      <div class="showcase-header">
        <div class="sys-tag">
          <div class="sys-dot"></div> ONBEAT HUD v2.0
        </div>
        <div class="difficulty-badge" id="diffBadge">MEDIUM</div>
      </div>

      <div class="showcase-content">
        <h1 class="showcase-title" id="showcaseTitle">LIGHTS OUT</h1>
        <p class="showcase-desc" id="showcaseDesc">
          Trening matrycowy polegający na wygaszaniu połączeń w jak najkrótszym czasie. Wymaga logicznego myślenia i planowania ruchów.
        </p>
      </div>

      <a href="lightsout/index.html" class="launch-btn" id="launchBtn">
        <span>INICJUJ HACK</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <!-- PRAWY PANEL WYBORU -->
    <div class="selector-panel">
      <div class="selector-title">// MODUŁY SYSTEMOWE</div>

      <!-- 1. Lights Out -->
      <div class="option-card active" style="--opt-color: #00f0ff;" 
           data-title="LIGHTS OUT" 
           data-desc="Trening matrycowy polegający na wygaszaniu połączeń w jak najkrótszym czasie. Wymaga logicznego myślenia i planowania ruchów."
           data-diff="MEDIUM"
           data-color="#00f0ff"
           data-glow="rgba(0, 240, 255, 0.4)"
           data-href="lightsout/index.html">
        <div class="option-info">
          <div class="option-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          </div>
          <div class="option-name">LIGHTS OUT</div>
        </div>
        <div class="active-indicator"></div>
      </div>

      <!-- 2. Alarm -->
      <div class="option-card" style="--opt-color: #ffe600;" 
           data-title="ALARM" 
           data-desc="Szybka weryfikacja pamięci wzrokowej i odtwarzanie sekwencji sygnałów ostrzegawczych w wyznaczonym reżimie czasowym."
           data-diff="EASY"
           data-color="#ffe600"
           data-glow="rgba(255, 230, 0, 0.4)"
           data-href="alarm/index.html">
        <div class="option-info">
          <div class="option-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          </div>
          <div class="option-name">ALARM</div>
        </div>
        <div class="active-indicator"></div>
      </div>

      <!-- 3. Ammunation -->
      <div class="option-card" style="--opt-color: #ff007f;" 
           data-title="AMMUNATION" 
           data-desc="Test natychmiastowego refleksu. Wymaga ultra-szybkiego czasu reakcji na zmienne bodźce wizualne."
           data-diff="HARD"
           data-color="#ff007f"
           data-glow="rgba(255, 0, 127, 0.4)"
           data-href="ammunation/index.html">
        <div class="option-info">
          <div class="option-icon">
            <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          </div>
          <div class="option-name">AMMUNATION</div>
        </div>
        <div class="active-indicator"></div>
      </div>

      <!-- 4. Jacht -->
      <a class="option-card" style="--opt-color: #ff3355;" 
           data-title="JACHT" 
           data-desc="Zaawansowany algorytm złamania zabezpieczeń jednostek morskich. Wymaga precyzji i zimnej krwi."
           data-diff="HARD"
           data-color="#ff3355"
           data-glow="rgba(255, 51, 85, 0.4)"
           data-href="jacht/index.html">
        <div class="option-info">
          <div class="option-icon">
            <svg viewBox="0 0 24 24"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.68c.08-.26.06-.54-.06-.78s-.34-.42-.6-.5L12 6.08 2.72 9.04c-.26.08-.47.26-.6.5s-.14.52-.06.78L3.95 19z"/></svg>
          </div>
          <div class="option-name">JACHT</div>
        </div>
        <div class="active-indicator"></div>
      </a>

      <!-- 5. Fleeca -->
      <div class="option-card" style="--opt-color: #00ff66;" 
           data-title="FLEECA" 
           data-desc="Symulacja hackingowa systemu bankowego Fleeca. Trening wieloetapowy pod presją upływającego czasu."
           data-diff="MEDIUM"
           data-color="#00ff66"
           data-glow="rgba(0, 255, 102, 0.4)"
           data-href="fleeca/index.html">
        <div class="option-info">
          <div class="option-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3 3.1-3 1.71 0 3.1 1.29 3.1 3v2z"/></svg>
          </div>
          <div class="option-name">FLEECA</div>
        </div>
        <div class="active-indicator"></div>
      </div>

    </div>

  </div>

  <script>
    // INTERAKCJA PRZEŁĄCZANIA MODUŁÓW
    const options = document.querySelectorAll('.option-card');
    const showcaseTitle = document.getElementById('showcaseTitle');
    const showcaseDesc = document.getElementById('showcaseDesc');
    const diffBadge = document.getElementById('diffBadge');
    const launchBtn = document.getElementById('launchBtn');
    const ambientGlow = document.getElementById('ambientGlow');
    const root = document.documentElement;

    options.forEach(option => {
      option.addEventListener('mouseenter', () => selectOption(option));
      option.addEventListener('click', () => {
        window.location.href = option.dataset.href;
      });
    });

    function selectOption(elem) {
      options.forEach(o => o.classList.remove('active'));
      elem.classList.add('active');

      const title = elem.dataset.title;
      const desc = elem.dataset.desc;
      const diff = elem.dataset.diff;
      const color = elem.dataset.color;
      const glow = elem.dataset.glow;
      const href = elem.dataset.href;

      showcaseTitle.textContent = title;
      showcaseDesc.textContent = desc;
      diffBadge.textContent = diff;
      launchBtn.href = href;

      // Zmiana Zmiennych CSS dla Animacji Kolorów
      root.style.setProperty('--primary', color);
      root.style.setProperty('--primary-glow', glow);
    }

    // TŁO - CANVAS
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.015)';
      for (let i = 0; i < canvas.width; i += 30) {
        ctx.fillRect(i, 0, 1, canvas.height);
      }
      requestAnimationFrame(drawBg);
    }
    drawBg();
  </script>

</body>
</html>
