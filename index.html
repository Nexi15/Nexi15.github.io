<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONBEAT.GG // SYSTEM HACKING</title>
  <style>
    :root {
      --bg: #030508;
      --card-bg: rgba(10, 14, 20, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background-color: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Tło - Dynamiczny Canvas */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Główny Kontener */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* HEADER SYSTEMOWY */
    header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border-left: 4px solid #ff007f;
      padding-left: 20px;
      position: relative;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ff007f;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #ff007f;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff007f;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, #a0a5b5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #5c6470;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }

    /* LISTA PANELOWA (HUD LIST) */
    .hack-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .hack-item {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    /* Pasek po lewej stronie przy hover */
    .hack-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.3s ease, width 0.3s ease;
      box-shadow: 0 0 15px currentColor;
    }

    .hack-item-left {
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 2;
    }

    /* Ikona z tłem */
    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    /* Informacje o Hacku */
    .hack-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hack-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .hack-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .diff-pill {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hack-sub {
      font-size: 0.75rem;
      color: #5c6470;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Prawa strona - Przycisk / Strzałka */
    .hack-item-right {
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 2;
    }

    .action-btn {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    /* Efekt podświetlenia myszki pod podłogą kafelka */
    .card-glow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.04), transparent 40%);
      pointer-events: none;
      z-index: 1;
    }

    /* HOVER STATES */
    .hack-item:hover {
      transform: translateX(8px);
      background: rgba(16, 22, 30, 0.85);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .hack-item:hover::before {
      opacity: 1;
      width: 6px;
    }

    .hack-item:hover .icon-box {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .hack-item:hover .icon-box svg {
      transform: scale(1.15);
    }

    .hack-item:hover .action-btn {
      color: #fff;
    }

    .hack-item:hover .arrow-icon {
      transform: translateX(5px);
    }

    /* ========================================================= */
    /* --- SYSTEM DEDYKOWANYCH KOLORÓW NEONOWYCH --- */
    /* ========================================================= */

    /* Cyan (Lights Out) */
    .color-cyan { color: #00f0ff; }
    .color-cyan .diff-pill { color: #00f0ff; border-color: rgba(0, 240, 255, 0.3); background: rgba(0, 240, 255, 0.08); }
    .color-cyan:hover { box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15); }
    .color-cyan:hover .hack-title { color: #00f0ff; text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); }

    /* Yellow (Alarm) */
    .color-yellow { color: #ffe600; }
    .color-yellow .diff-pill { color: #ffe600; border-color: rgba(255, 230, 0, 0.3); background: rgba(255, 230, 0, 0.08); }
    .color-yellow:hover { box-shadow: 0 10px 30px rgba(255, 230, 0, 0.15); }
    .color-yellow:hover .hack-title { color: #ffe600; text-shadow: 0 0 12px rgba(255, 230, 0, 0.6); }

    /* Pink (Ammunation) */
    .color-pink { color: #ff007f; }
    .color-pink .diff-pill { color: #ff007f; border-color: rgba(255, 0, 127, 0.3); background: rgba(255, 0, 127, 0.08); }
    .color-pink:hover { box-shadow: 0 10px 30px rgba(255, 0, 127, 0.15); }
    .color-pink:hover .hack-title { color: #ff007f; text-shadow: 0 0 12px rgba(255, 0, 127, 0.6); }

    /* Red (Jacht) */
    .color-red { color: #ff3355; }
    .color-red .diff-pill { color: #ff3355; border-color: rgba(255, 51, 85, 0.3); background: rgba(255, 51, 85, 0.08); }
    .color-red:hover { box-shadow: 0 10px 30px rgba(255, 51, 85, 0.15); }
    .color-red:hover .hack-title { color: #ff3355; text-shadow: 0 0 12px rgba(255, 51, 85, 0.6); }

    /* Green (Fleeca) */
    .color-green { color: #00ff66; }
    .color-green .diff-pill { color: #00ff66; border-color: rgba(0, 255, 102, 0.3); background: rgba(0, 255, 102, 0.08); }
    .color-green:hover { box-shadow: 0 10px 30px rgba(0, 255, 102, 0.15); }
    .color-green:hover .hack-title { color: #00ff66; text-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }

    @media (max-width: 600px) {
      header h1 { font-size: 2rem; }
      .hack-item { padding: 16px 20px; }
      .icon-box { width: 44px; height: 44px; }
      .hack-title { font-size: 1.1rem; }
      .action-btn span { display: none; }
    }
  </style>
</head>

  <script>
    // Podświetlenie pozycji pod kursorem myszy
    const items = document.querySelectorAll('.hack-item');

    items.forEach(item => {
      item.addEventListener('mousemove', e => {
        const rect = item.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        item.style.setProperty('--mouse-x', `${x}px`);
        item.style.setProperty('--mouse-y', `${y}px`);
      });
    });

    // Cyberpunkowy Grid + Cząsteczki w Tle (Canvas)
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gridOffset = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Siatka cyfrowa w tle
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;

      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
