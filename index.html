<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONBEAT.GG HACKS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #030507;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Tło - Canvas */
    #bgCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* NAGŁÓWEK z efektem Glow + Neon */
    header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }

    header h1 {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(-45deg, #ff007f, #ff3366, #e040fb, #ff007f);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientPink 4s ease infinite;
      filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.6));
    }

    @keyframes gradientPink {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header p {
      color: #6c757d;
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* GRID KART */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      width: 100%;
      perspective: 1000px; /* Dla efektu 3D */
    }

    /* KARTA 3D */
    .card {
      background: rgba(10, 14, 18, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 35px 25px 30px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 350px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    /* Światło wewnątrz karty podążające za myszką */
    .card-glow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 20px;
      background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.06), transparent 40%);
      pointer-events: none;
      z-index: 1;
    }

    /* Ikona */
    .card-icon {
      width: 55px;
      height: 55px;
      z-index: 2;
      transform: translateZ(30px);
      transition: transform 0.3s ease;
    }

    .card-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    /* Tytuł */
    .card-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      z-index: 2;
      transform: translateZ(25px);
      transition: text-shadow 0.3s ease;
    }

    /* Stopka */
    .card-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 2;
      transform: translateZ(20px);
    }

    .line {
      height: 2px;
      width: 35%;
      border-radius: 2px;
      transition: all 0.4s ease;
    }

    .btn-text {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-text span { transition: transform 0.3s ease; }

    /* Hover ogólny */
    .card:hover .line { width: 100%; }
    .card:hover .btn-text { opacity: 1; letter-spacing: 3px; }
    .card:hover .btn-text span { transform: translateX(5px); }

    /* ========================================================= */
    /* --- KOLORYSTYKA I NEON DLA KAŻDEGO HACKA --- */
    /* ========================================================= */

    /* Cyan (Lights Out) */
    .card-cyan { color: #00f0ff; }
    .card-cyan .line { background: #00f0ff; box-shadow: 0 0 10px #00f0ff; }
    .card-cyan:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 240, 255, 0.25);
    }
    .card-cyan:hover .card-title { text-shadow: 0 0 20px rgba(0, 240, 255, 0.9); }

    /* Yellow (Alarm) */
    .card-yellow { color: #ffe600; }
    .card-yellow .line { background: #ffe600; box-shadow: 0 0 10px #ffe600; }
    .card-yellow:hover {
      border-color: rgba(255, 230, 0, 0.4);
      box-shadow: 0 20px 40px rgba(255, 230, 0, 0.25);
    }
    .card-yellow:hover .card-title { text-shadow: 0 0 20px rgba(255, 230, 0, 0.9); }

    /* Pink (Ammunation) */
    .card-pink { color: #ff007f; }
    .card-pink .line { background: #ff007f; box-shadow: 0 0 10px #ff007f; }
    .card-pink:hover {
      border-color: rgba(255, 0, 127, 0.4);
      box-shadow: 0 20px 40px rgba(255, 0, 127, 0.25);
    }
    .card-pink:hover .card-title { text-shadow: 0 0 20px rgba(255, 0, 127, 0.9); }

    /* Red (Jacht) */
    .card-red { color: #ff3355; }
    .card-red .line { background: #ff3355; box-shadow: 0 0 10px #ff3355; }
    .card-red:hover {
      border-color: rgba(255, 51, 85, 0.4);
      box-shadow: 0 20px 40px rgba(255, 51, 85, 0.25);
    }
    .card-red:hover .card-title { text-shadow: 0 0 20px rgba(255, 51, 85, 0.9); }

    /* Green (Fleeca) */
    .card-green { color: #00ff66; }
    .card-green .line { background: #00ff66; box-shadow: 0 0 10px #00ff66; }
    .card-green:hover {
      border-color: rgba(0, 255, 102, 0.4);
      box-shadow: 0 20px 40px rgba(0, 255, 102, 0.25);
    }
    .card-green:hover .card-title { text-shadow: 0 0 20px rgba(0, 255, 102, 0.9); }

    @media (max-width: 600px) {
      header h1 { font-size: 2.2rem; }
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="wrapper">
    <header>
      <h1>Wybierz Hacka</h1>
      <p>Systemy Treningowe ONBEAT.GG</p>
    </header>

    <div class="grid-container">

      <!-- 1. Lights Out -->
      <a href="lightsout/index.html" class="card card-cyan">
        <div class="card-glow"></div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </div>
        <div class="card-title">LIGHTS OUT</div>
        <div class="card-footer">
          <div class="line"></div>
          <div class="btn-text">Uruchom <span>➔</span></div>
        </div>
      </a>

      <!-- 2. Alarm -->
      <a href="alarm/index.html" class="card card-yellow">
        <div class="card-glow"></div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </div>
        <div class="card-title">ALARM</div>
        <div class="card-footer">
          <div class="line"></div>
          <div class="btn-text">Uruchom <span>➔</span></div>
        </div>
      </a>

      <!-- 3. Ammunation -->
      <a href="ammunation/index.html" class="card card-pink">
        <div class="card-glow"></div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>
        <div class="card-title">AMMUNATION</div>
        <div class="card-footer">
          <div class="line"></div>
          <div class="btn-text">Uruchom <span>➔</span></div>
        </div>
      </a>

      <!-- 4. Jacht -->
      <a href="jacht/index.html" class="card card-red">
        <div class="card-glow"></div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.68c.08-.26.06-.54-.06-.78s-.34-.42-.6-.5L12 6.08 2.72 9.04c-.26.08-.47.26-.6.5s-.14.52-.06.78L3.95 19z"/></svg>
        </div>
        <div class="card-title">JACHT</div>
        <div class="card-footer">
          <div class="line"></div>
          <div class="btn-text">Uruchom <span>➔</span></div>
        </div>
      </a>

      <!-- 5. Fleeca -->
      <a href="fleeca/index.html" class="card card-green">
        <div class="card-glow"></div>
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3 3.1-3 1.71 0 3.1 1.29 3.1 3v2z"/></svg>
        </div>
        <div class="card-title">FLEECA</div>
        <div class="card-footer">
          <div class="line"></div>
          <div class="btn-text">Uruchom <span>➔</span></div>
        </div>
      </a>

    </div>
  </div>

  <script>
    // --- EFEKT 3D TILT & LIGHT GLOW NA KARTACH ---
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Ustawienie punktu światła
        card.style.setProperty('--mouse-x', `${x}px`);
        card.style.setProperty('--mouse-y', `${y}px`);

        // Obliczenie kąta pochylenia 3D
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -12;
        const rotateY = ((x - centerX) / centerX) * 12;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    });

    // --- ANIMACJA TŁA (DYNAMICZNE CZĄSTECZKI) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 0, 127, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
