<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleeca Bank - Trener Hackowania</title>
  <style>
    :root {
      --bg-main: #070913;
      --panel-bg: rgba(18, 22, 36, 0.85);
      --panel-border: rgba(0, 243, 255, 0.2);
      --accent-cyan: #00f3ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    .app-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }

    .level-tabs {
      display: flex;
      gap: 10px;
      background: rgba(12, 15, 26, 0.9);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      margin-bottom: 20px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active {
      background: rgba(0, 243, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
    }

    .level-container {
      display: none;
      width: 100%;
      max-width: 500px;
    }
    .level-container.active { display: block; }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 4px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--accent-cyan);
      transition: width 0.1s linear;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 10px 20px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-cyan); color: #000; }

    /* RESULTS OVERLAY */
    .result-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 50;
    }

    /* === GAME 1: ŚCIEŻKA === */
    .board-sciezka {
      position: relative;
      width: 100%;
      height: 340px;
      background: #080b14;
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 10px;
    }
    svg.lines-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    line.node-line {
      stroke: var(--accent-pink);
      stroke-width: 3;
      stroke-linecap: round;
    }
    .node-sciezka {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #121829;
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .node-sciezka.active {
      background: rgba(255, 0, 127, 0.3);
      border-color: var(--accent-pink);
      box-shadow: 0 0 10px var(--accent-pink);
    }

    /* === GAME 2: KLAWIATURA === */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .key-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }
    .key-btn.active-target {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }
    .key-progress-bg {
      width: 100%;
      height: 12px;
      background: #1a2030;
      border-radius: 6px;
      position: relative;
      margin-top: 15px;
      overflow: hidden;
    }
    .key-green-zone {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--accent-green);
      opacity: 0.6;
    }
    .key-pointer {
      position: absolute;
      top: 0; bottom: 0;
      width: 4px;
      background: #fff;
    }

    /* === GAME 3: MINY === */
    .grid-miny {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      background: #080b14;
      padding: 10px;
      border-radius: 10px;
    }
    .cell-mina {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
    }
    .cell-mina.has-mine {
      background: rgba(255, 0, 127, 0.4);
      border-color: var(--accent-pink);
    }
